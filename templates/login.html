{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper" style="min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="auth-card" style="backdrop-filter: blur(12px); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 420px;">
        <h2 class="auth-heading" style="margin-bottom: 2rem; text-align: center; font-size: 28px; font-weight: 700;">Welcome Back</h2>
        
        {% if error %}
        <div style="background: rgba(255, 71, 87, 0.1); border-left: 4px solid #ff4757; color: #ff4757; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; font-size: 14px;">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div style="margin-bottom: 1.25rem;">
                <label class="auth-label" style="display: block; margin-bottom: 0.5rem; font-size: 14px; font-weight: 500;">Email Address</label>
                <input class="auth-input" type="email" name="email" placeholder="company@example.com" required style="width: 100%; padding: 0.875rem; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 2rem;">
                <label class="auth-label" style="display: block; margin-bottom: 0.5rem; font-size: 14px; font-weight: 500;">Password</label>
                <input class="auth-input" type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 0.875rem; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 1rem; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);">
                Log In
            </button>
        </form>
        
        <div class="auth-footer" style="margin-top: 2rem; text-align: center; font-size: 14px;">
            Don't have a company account? <br>
            <a href="/register" style="color: #4facfe; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 0.5rem; transition: color 0.2s;">Register your company</a>
        </div>
    </div>
</div>
{% endblock %}
